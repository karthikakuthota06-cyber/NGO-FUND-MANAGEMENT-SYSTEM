<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password | NGO Fund Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

<!-- Left Panel -->

<div class="col-lg-6 left-panel d-none d-lg-flex">

<div class="left-content">

<img src="ngo.png" class="logo" height="950px" width="600px" style="padding:0px;margin:0px;">

</div>

</div>

<!-- Reset Password Card -->

<div class="col-lg-6 d-flex justify-content-center align-items-center">

<div class="login-card">

<div class="text-center mb-4">

<i class="fa-solid fa-lock login-icon"></i>

<h2>Reset Password</h2>

<p>Create a New Password</p>

</div>

<form id="resetForm">

<div class="mb-3">

<label class="form-label">

<i class="fa-solid fa-lock"></i>

New Password

</label>

<div class="input-group">

<input
type="password"
id="newPassword"
class="form-control"
placeholder="Enter New Password"
required>

<button
type="button"
class="btn btn-outline-secondary"
onclick="togglePassword('newPassword','eye1')">

<i class="fa-solid fa-eye" id="eye1"></i>

</button>

</div>

</div>

<div class="mb-3">

<label class="form-label">

<i class="fa-solid fa-lock"></i>

Confirm Password

</label>

<div class="input-group">

<input
type="password"
id="confirmPassword"
class="form-control"
placeholder="Confirm Password"
required>

<button
type="button"
class="btn btn-outline-secondary"
onclick="togglePassword('confirmPassword','eye2')">

<i class="fa-solid fa-eye" id="eye2"></i>

</button>

</div>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-success login-btn">

Reset Password

</button>

</div>

<p
id="resetMessage"
class="text-center mt-3 fw-bold">

</p>

</form>

<hr>

<div class="text-center">

<a href="forgot.html">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</div>

</div>

</div>

</div>

</div>

<script>

function togglePassword(inputId, eyeId){

let password=document.getElementById(inputId);

let eye=document.getElementById(eyeId);

if(password.type==="password"){

password.type="text";

eye.classList.remove("fa-eye");

eye.classList.add("fa-eye-slash");

}

else{

password.type="password";

eye.classList.remove("fa-eye-slash");

eye.classList.add("fa-eye");

}

}

document.getElementById("resetForm").addEventListener("submit",function(e){

e.preventDefault();

let newPassword=document.getElementById("newPassword").value;

let confirmPassword=document.getElementById("confirmPassword").value;

let message=document.getElementById("resetMessage");

if(newPassword!==confirmPassword){

message.style.color="red";

message.innerHTML="Passwords do not match.";

return;

}

if(newPassword.length<6){

message.style.color="red";

message.innerHTML="Password must contain at least 6 characters.";

return;

}

// Update registered user password

let user=JSON.parse(localStorage.getItem("ngoUser"));

if(user){

user.password=newPassword;

localStorage.setItem("ngoUser",JSON.stringify(user));

}

message.style.color="green";

message.innerHTML="Password Updated Successfully!";

setTimeout(function(){

window.location.href="Login.html";

},2000);

});

</script>

</body>

</html>
