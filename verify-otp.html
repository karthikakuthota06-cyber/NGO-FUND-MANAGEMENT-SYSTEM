<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verify OTP | NGO Fund Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

<!-- Left Side -->

<div class="col-lg-6 left-panel d-none d-lg-flex">

<div class="left-content">
<img src="ngo.png" class="logo" height="950px" width="600px" style="padding:0px;margin:0px;">




</div>

</div>

<!-- Right Side -->

<div class="col-lg-6 d-flex justify-content-center align-items-center">

<div class="login-card">

<div class="text-center mb-4">

<i class="fa-solid fa-shield-halved login-icon"></i>

<h2>Verify OTP</h2>

<p>Enter the 6-digit OTP</p>

</div>

<form id="otpForm">

<div class="mb-3">

<label class="form-label">

<i class="fa-solid fa-key"></i>

OTP

</label>

<input
type="text"
id="otp"
class="form-control"
maxlength="6"
placeholder="Enter OTP"
required>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-success login-btn">

Verify OTP

</button>

</div>

<p
id="otpError"
class="text-danger text-center mt-3">

</p>

</form>

<hr>

<div class="text-center">

<a href="forgot.html">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</div>

</div>

</div>

</div>

</div>

<script>

document.getElementById("otpForm").addEventListener("submit",function(e){

e.preventDefault();

let otp=document.getElementById("otp").value;

let error=document.getElementById("otpError");

const demoOTP="123456";

if(otp===demoOTP){

alert("OTP Verified Successfully");

window.location.href="reset.html";

}
else{

error.innerHTML="Invalid OTP";

}

});

</script>

</body>

</html>
