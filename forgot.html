<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | NGO Fund Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

<!-- Left Panel -->

<div class="col-lg-6 left-panel d-none d-lg-flex">

<div class="left-content">

<img src="ngo.png" class="logo" height="950px" width="600px" style="padding:0px;margin:0px;">

</div>

</div>

<!-- Forgot Password Card -->

<div class="col-lg-6 d-flex justify-content-center align-items-center">

<div class="login-card">

<div class="text-center mb-4">

<i class="fa-solid fa-key login-icon"></i>

<h2>Forgot Password?</h2>

<p>Enter your registered email address</p>

</div>

<form id="forgotForm">

<div class="mb-3">

<label class="form-label">

<i class="fa-solid fa-envelope"></i>

Email Address

</label>

<input
type="email"
id="forgotEmail"
class="form-control"
placeholder="Enter Registered Email"
required>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-success login-btn">

Send Reset Link

</button>

</div>

<p
id="forgotMessage"
class="text-success text-center mt-3">

</p>

</form>

<hr>

<div class="text-center">

<a href="Login.html">

<i class="fa-solid fa-arrow-left"></i>

Back to Login

</a>

</div>

</div>

</div>

</div>

</div>

<script>

document.getElementById("forgotForm").addEventListener("submit",function(e){

e.preventDefault();

let email=document.getElementById("forgotEmail").value;

document.getElementById("forgotMessage").innerHTML=
"Password reset link has been sent to <b>"+email+"</b>";

setTimeout(function(){

window.location.href="verify-otp.html";

},3000);

});

</script>

</body>

</html>
