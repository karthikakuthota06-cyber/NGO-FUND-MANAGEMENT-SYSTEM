<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register | NGO Fund Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="container-fluid">

<div class="row vh-100">

<!-- Left Panel -->

<div class="col-lg-6 left-panel d-none d-lg-flex">

<div class="left-content">

<img src="ngo.png" class="logo" height="950px" width="600px" style="padding:0px;margin:0px;">



</div>

</div>

<!-- Register Form -->

<div class="col-lg-6 d-flex justify-content-center align-items-center">

<div class="login-card">

<div class="text-center mb-4">

<i class="fa-solid fa-user-plus login-icon"></i>

<h2>Create Account</h2>

<p>Register to continue</p>

</div>

<form id="registerForm">

<div class="mb-3">

<label class="form-label">

Full Name

</label>

<input
type="text"
id="fullname"
class="form-control"
placeholder="Enter Full Name"
required>

</div>

<div class="mb-3">

<label class="form-label">

Email Address

</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter Email Address"
required>

</div>

<div class="mb-3">

<label class="form-label">

Mobile Number

</label>

<input
type="tel"
id="mobile"
class="form-control"
maxlength="10"
placeholder="Enter Mobile Number"
required>

</div>

<div class="mb-3">

<label class="form-label">

Password

</label>

<div class="input-group">

<input
type="password"
id="password"
class="form-control"
placeholder="Enter Password"
required>

<button
type="button"
class="btn btn-outline-secondary"
id="togglePassword">

<i class="fa-solid fa-eye" id="eye1"></i>

</button>

</div>

</div>

<div class="mb-3">

<label class="form-label">

Confirm Password

</label>

<div class="input-group">

<input
type="password"
id="confirmPassword"
class="form-control"
placeholder="Confirm Password"
required>

<button
type="button"
class="btn btn-outline-secondary"
id="toggleConfirmPassword">

<i class="fa-solid fa-eye" id="eye2"></i>

</button>

</div>

</div>

<div class="d-grid">

<button
type="submit"
class="btn btn-success login-btn">

Register

</button>

</div>

<p id="registerError" class="text-danger text-center mt-3"></p>

<p id="success" class="text-success text-center mt-2"></p>

</form>

<hr>

<div class="text-center">

Already have an account?

<a href="Login.html">

Login Here

</a>

</div>

</div>

</div>

</div>

</div>

<script>

// Show/Hide Password

document.getElementById("togglePassword").addEventListener("click",function(){

let password=document.getElementById("password");
let eye=document.getElementById("eye1");

if(password.type==="password"){

password.type="text";

eye.classList.replace("fa-eye","fa-eye-slash");

}
else{

password.type="password";

eye.classList.replace("fa-eye-slash","fa-eye");

}

});

// Show/Hide Confirm Password

document.getElementById("toggleConfirmPassword").addEventListener("click",function(){

let password=document.getElementById("confirmPassword");
let eye=document.getElementById("eye2");

if(password.type==="password"){

password.type="text";

eye.classList.replace("fa-eye","fa-eye-slash");

}
else{

password.type="password";

eye.classList.replace("fa-eye-slash","fa-eye");

}

});

// Register

document.getElementById("registerForm").addEventListener("submit",function(e){

e.preventDefault();

let fullname=document.getElementById("fullname").value.trim();
let email=document.getElementById("email").value.trim();
let mobile=document.getElementById("mobile").value.trim();
let password=document.getElementById("password").value;
let confirmPassword=document.getElementById("confirmPassword").value;

let error=document.getElementById("registerError");
let success=document.getElementById("success");

error.innerHTML="";
success.innerHTML="";

// Validation

if(password!==confirmPassword){

error.innerHTML="Passwords do not match.";

return;

}

if(mobile.length!==10){

error.innerHTML="Enter a valid 10-digit mobile number.";

return;

}

// Save User

let user={

fullname:fullname,
email:email,
mobile:mobile,
password:password

};

localStorage.setItem("ngoUser",JSON.stringify(user));

success.innerHTML="Registration Successful! Redirecting to Login...";

setTimeout(function(){

window.location.href="Login.html";

},2000);

});

</script>

</body>

</html>
