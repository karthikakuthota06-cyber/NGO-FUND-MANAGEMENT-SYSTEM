<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate Here</title>
    <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:green;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    width:500px;
    height:450px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
}

h1{
    color:green;
    font-size:34px;
    margin-bottom:18px;
    font-weight:bold;
}

h3{
    color:#000;
    font-size:20px;
    margin-bottom:20px;
}

.qr-box{
    width:250px;
    height:250px;
    margin:auto;
    border:3px solid #444;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.qr-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.note{
    color:green;
    font-size:16px;
    margin-top:20px;
}
</style>
</head>
<body>

<div class="container">

    <h1>DONATE HERE</h1>

    <h3>Scan the QR Code</h3>

    <div class="qr-box">
        <img src="QR.jpg" alt="QR Code">
    </div>

    <p class="note">
        Please do payment within 5 minutes.
    </p>

</div>

<script>
window.onload = function () {
    console.log("Donate Page Loaded Successfully");
};
</script>
</body>
</html>
